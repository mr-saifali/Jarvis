name: Build Jarvis Android APK & Test Brain

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Jarvis Brain tests
        working-directory: brain
        run: npm test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-brain, build-apk]
    environment: android-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          dir="$GITHUB_WORKSPACE/android/.release-signing"
          mkdir -m 700 "$dir"
          key="$dir/release.p12"
          printf '%s' "${KEYSTORE_BASE64:?Missing JARVIS_KEYSTORE_BASE64 in android-release}" | base64 --decode > "$key"
          test -s "$key" || { echo '::error::Decoded release keystore is empty'; exit 1; }
          printf 'JARVIS_KEYSTORE=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          JARVIS_STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${JARVIS_STORE_PASSWORD:?Missing store password}" "${JARVIS_KEY_ALIAS:?Missing key alias}" "${JARVIS_KEY_PASSWORD:?Missing key password}"
          test -r "$JARVIS_KEYSTORE" && test -s "$JARVIS_KEYSTORE" || { echo '::error::Prepared signing file is missing or unreadable'; exit 1; }
          ./gradlew assembleRelease --no-daemon

      - name: Remove release keystore
        if: always()
        run: rm -f -- "$GITHUB_WORKSPACE/android/.release-signing/release.p12"

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Jarvis Agent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jarvis-agent.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest jarvis-agent.apk --clobber
          else
            gh release create latest jarvis-agent.apk \
              --title "J.A.R.V.I.S. Android APK (Latest)" \
              --notes "Signed Android APK build from main. Download jarvis-agent.apk, install on your Android phone, and connect to https://marcuss.vercel.app."
          fi
