name: Build Jarvis Android APK & Test Brain

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Jarvis Brain tests
        working-directory: brain
        run: npm test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload Jarvis Agent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jarvis-agent.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest jarvis-agent.apk --clobber
          else
            gh release create latest jarvis-agent.apk \
              --title "J.A.R.V.I.S. Android APK (Latest)" \
              --notes "Signed Android APK build from main. Download jarvis-agent.apk, install on your Android phone, and connect to https://marcuss.vercel.app."
          fi
